name: 'CI'
# Update the paths once you have created a client library build
on:
  workflow_dispatch:
    inputs:
      publish-to-private-pypi:
        description: Whether to publish the build to the private PyPI
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    paths:
      - "ansys-grantami-serverapi-openapi/**"
      - ".github/workflows/build_and_test_library.yml"

env:
  MAIN_PYTHON_VERSION: '3.13'
  LIBRARY_NAME: 'ansys-grantami-serverapi-openapi'

jobs:
  check-style:
    name: "Check code style"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: "Install pre-commit"
        run: |
          uv tool install pre-commit

      - name: "Run pre-commit"
        run: |
          pre-commit run --all-files

  tests:
    name: "Test Python ${{ matrix.python-version }} - ${{ matrix.platform }}"
    runs-on: ${{ matrix.platform }}
    needs: check-style
    strategy:
      matrix:
        platform: [ 'ubuntu-latest', 'windows-latest' ]
        python-version: [ '3.12', '3.13', '3.14' ]
      fail-fast: false
    steps:
      - name: "Enable long paths on Windows"
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true

      - name: "Checkout the project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Test with pytest"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: uv run pytest

      - name: "Run mypy"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: uv run mypy

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      id-token: write
      attestations: write
    steps:

      - name: "Checkout the project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: "Install requirements"
        run: |
          uv tool install twine

      - name: "Create source and wheel artifacts"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: |
          uv build

      - name: "Validate integrity of artifacts"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: |
          twine check dist/*

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.LIBRARY_NAME }}/dist/

      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  #v7.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}/dist/
          retention-days: 7

  publish:
    name: "Publish"
    runs-on: ubuntu-latest
    needs: [build-library]
    if: (github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') && (inputs.publish-to-private-pypi == 'true')
    steps:
      - name: "Release to private PyPI"
        uses: ansys/actions/release-pypi-private@87ff2e65e8884121f9afc97728ca9f213228ecc2  # v11.1.4
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          twine-username: "__token__"
          twine-token: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}
          verify-tag-version: false
          skip-existing: false

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

      - name: "Release to private PyPI"
        uses: ansys/actions/release-pypi-private@87ff2e65e8884121f9afc97728ca9f213228ecc2  # v11.1.4
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          twine-username: "__token__"
          twine-token: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}

      - name: "Release to GitHub"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  #v3.0.3
        with:
          files: ${{ env.LIBRARY_NAME }}-artifacts/*.whl
          generate_release_notes: true
